<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-recycle"></i>
      <span>EcoDescarte</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <i class="bi bi-grid"></i>
        <span>Dashboard</span>
      </a>

      <a routerLink="/descartes" routerLinkActive="active">
        <i class="bi bi-trash3"></i>
        <span>Descartes</span>
      </a>

      <a routerLink="/categorias" routerLinkActive="active">
        <i class="bi bi-tags"></i>
        <span>Categorias</span>
      </a>

      <a routerLink="/pontos-coleta" routerLinkActive="active">
        <i class="bi bi-geo-alt"></i>
        <span>Pontos de coleta</span>
      </a>

      <a routerLink="/responsaveis" routerLinkActive="active">
        <i class="bi bi-people"></i>
        <span>Responsáveis</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h5 class="mb-0">Sistema de Gestão Ambiental</h5>
        <small class="text-muted">
          Gerenciamento de resíduos eletrônicos
        </small>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>

</div>
